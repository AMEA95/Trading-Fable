<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e11">
<title>Radar de caídas</title>
<style>
:root{
  --bg:#0b0e11; --card:#12171d; --border:#232a33; --text:#e8edf3; --muted:#8b98a8;
  --red:#f6465d; --green:#0ecb81; --yellow:#f0b90b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);}
header{position:sticky;top:0;z-index:5;background:rgba(11,14,17,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;gap:10px;}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px;}
#recargar{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:9px;padding:7px 12px;font-size:13px;font-family:inherit;}
#recargar:active{background:var(--card);}
main{padding:14px 16px;max-width:640px;margin:0 auto;}
.tabs{display:flex;gap:8px;margin:0 0 14px;}
.tab{flex:1;padding:11px;border-radius:11px;border:1px solid var(--border);
  background:var(--card);color:var(--muted);font-size:14px;font-weight:600;font-family:inherit;}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text);}
.foto{border:1px solid var(--border);border-radius:13px;padding:13px;margin-bottom:14px;
  background:var(--card);}
.foto .t{font-weight:700;margin-bottom:5px;font-size:15px;}
.foto .d{color:var(--muted);font-size:13.5px;}
.moneda{border:1px solid var(--border);border-left-width:3px;border-radius:13px;
  padding:13px;margin-bottom:11px;background:var(--card);}
.moneda.sostenido{border-left-color:var(--red);}
.moneda.medio{border-left-color:var(--yellow);}
.moneda.rapido{border-left-color:var(--muted);}
.sube .moneda.sostenido{border-left-color:var(--green);}
.fila1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px;}
.sym{font-size:18px;font-weight:700;letter-spacing:-.3px;}
.precio{color:var(--muted);font-size:13px;}
.tipo{margin-left:auto;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.medidores{display:flex;gap:8px;margin:10px 0;}
.med{flex:1;background:#0b0e11;border-radius:9px;padding:8px 10px;}
.med .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
.med .v{font-size:19px;font-weight:700;line-height:1.2;}
.barra{height:4px;border-radius:2px;background:#1c232c;margin-top:5px;overflow:hidden;}
.barra i{display:block;height:100%;border-radius:2px;}
.linea{border-radius:9px;padding:9px 11px;margin:7px 0;font-size:13.5px;line-height:1.5;
  background:#0b0e11;border:1px solid var(--border);}
.linea.ok{border-color:#12402c;background:#0c1f17;}
.linea.no{border-color:#4a1d24;background:#1c1013;}
.niveles{display:flex;gap:8px;margin-top:9px;}
.niv{flex:1;background:#0b0e11;border-radius:9px;padding:8px 10px;text-align:center;}
.niv .k{color:var(--muted);font-size:11px;}
.niv .v{font-weight:700;font-size:14px;}
.hist{color:var(--muted);font-size:12.5px;margin-top:9px;line-height:1.5;}
.vacio{color:var(--muted);font-size:14px;padding:18px 4px;line-height:1.6;}
.aviso{border:1px solid #6b5405;background:#2a2001;color:var(--yellow);
  border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.55;margin-bottom:14px;}
.pie{color:#5c6773;font-size:11.5px;line-height:1.6;margin-top:20px;}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0;}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
th{color:var(--muted);font-weight:600;text-align:right;padding:5px 4px;border-bottom:1px solid var(--border);}
th:first-child,td:first-child{text-align:left;}
td{padding:5px 4px;border-bottom:1px solid #171d24;text-align:right;}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--border);
  border-top-color:var(--yellow);border-radius:50%;animation:g .8s linear infinite;
  vertical-align:-2px;margin-right:7px;}
@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>📡 Radar de caídas</h1>
  <button id="recargar">Actualizar</button>
</header>
<main>
  <div id="foto"></div>
  <div class="tabs">
    <button class="tab on" data-lado="-1">🔻 Caídas</button>
    <button class="tab" data-lado="1">🔺 Subidas</button>
  </div>
  <div id="lista" class="vacio"><span class="spinner"></span>Conectando con Binance…</div>
  <div class="pie" id="pie"></div>
</main>

<script>
'use strict';
const FAPI = 'https://fapi.binance.com';

/* ================= MOTOR =================
   Sólo lo que hace falta para el radar. Es el mismo código que se probó en la
   versión grande, recortado a lo imprescindible.
   ========================================= */
const MV = {
  H: 32,          // horizonte del estudio: 32 velas de 15m = 8 horas
  MIN: 15,        // minutos por vela del estudio
  LB: 96,         // lookback del canal largo (96×15m = 24 h)
  WARM: 240,      // primera vela utilizable (necesita EMA larga + ADX)
  COOL: 12,       // separación mínima entre muestras históricas (evita duplicados)
  SL_ATR: 1.5,    // stop del estudio, en ATR
  TP_ATR: 3.0,    // objetivo del estudio, en ATR (= 2R)
};

const ET = {
  PB_ATR: 0.5,    // cuánto tiene que retroceder el precio para la entrada con límite
  PB_WAIT: 4,     // velas de 15m que se espera ese retroceso (= 1 hora)
  LATE: 4,        // velas de retraso que simulan "he dudado una hora"
  MIN_N: 4,       // muestra mínima para dar un consejo
};

/* ================= INDICADORES =================
   Implementaciones estándar (Wilder para RSI/ATR/ADX).
   Devuelven arrays alineados con la entrada; null donde no hay dato. */
function smaArr(v, p) {
  const out = new Array(v.length).fill(null); let s = 0;
  for (let i = 0; i < v.length; i++) {
    s += v[i]; if (i >= p) s -= v[i-p];
    if (i >= p-1) out[i] = s / p;
  }
  return out;
}

function emaArr(v, p) {
  const out = new Array(v.length).fill(null);
  if (v.length < p) return out;
  const k = 2 / (p + 1);
  let seed = 0; for (let i = 0; i < p; i++) seed += v[i];
  seed /= p; out[p-1] = seed;
  for (let i = p; i < v.length; i++) out[i] = v[i]*k + out[i-1]*(1-k);
  return out;
}

function rsiArr(c, p = 14) {
  const out = new Array(c.length).fill(null);
  if (c.length < p+1) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= p; i++) { const d = c[i]-c[i-1]; if (d>0) g+=d; else l-=d; }
  let ag = g/p, al = l/p;
  out[p] = al === 0 ? 100 : 100 - 100/(1 + ag/al);
  for (let i = p+1; i < c.length; i++) {
    const d = c[i]-c[i-1];
    ag = (ag*(p-1) + (d>0?d:0)) / p;
    al = (al*(p-1) + (d<0?-d:0)) / p;
    out[i] = al === 0 ? 100 : 100 - 100/(1 + ag/al);
  }
  return out;
}

function atrArr(h, l, c, p = 14) {
  const n = c.length, out = new Array(n).fill(null);
  if (n < p+1) return out;
  const tr = new Array(n).fill(null);
  for (let i = 1; i < n; i++)
    tr[i] = Math.max(h[i]-l[i], Math.abs(h[i]-c[i-1]), Math.abs(l[i]-c[i-1]));
  let s = 0; for (let i = 1; i <= p; i++) s += tr[i];
  out[p] = s / p;
  for (let i = p+1; i < n; i++) out[i] = (out[i-1]*(p-1) + tr[i]) / p;
  return out;
}

function adxArr(h, l, c, p = 14) {
  const n = c.length;
  const adx = new Array(n).fill(null), pdi = new Array(n).fill(null), mdi = new Array(n).fill(null);
  if (n < 2*p+1) return { adx, pdi, mdi };
  const trA = [], pdmA = [], mdmA = [];
  for (let i = 1; i < n; i++) {
    const up = h[i]-h[i-1], dn = l[i-1]-l[i];
    pdmA.push(up > dn && up > 0 ? up : 0);
    mdmA.push(dn > up && dn > 0 ? dn : 0);
    trA.push(Math.max(h[i]-l[i], Math.abs(h[i]-c[i-1]), Math.abs(l[i]-c[i-1])));
  }
  let trS = 0, pS = 0, mS = 0;
  for (let i = 0; i < p; i++) { trS += trA[i]; pS += pdmA[i]; mS += mdmA[i]; }
  const dxs = [];
  for (let i = p; i <= trA.length; i++) {
    const P = trS === 0 ? 0 : 100 * pS / trS;
    const M = trS === 0 ? 0 : 100 * mS / trS;
    pdi[i] = P; mdi[i] = M;
    const dx = (P+M) === 0 ? 0 : 100 * Math.abs(P-M) / (P+M);
    dxs.push(dx);
    if (dxs.length === p) adx[i] = dxs.reduce((a,b)=>a+b,0) / p;
    else if (dxs.length > p) adx[i] = (adx[i-1]*(p-1) + dx) / p;
    if (i < trA.length) {
      trS = trS - trS/p + trA[i]; pS = pS - pS/p + pdmA[i]; mS = mS - mS/p + mdmA[i];
    }
  }
  return { adx, pdi, mdi };
}

function last(arr) { for (let i = arr.length-1; i >= 0; i--) if (arr[i] !== null && arr[i] !== undefined && !isNaN(arr[i])) return arr[i]; return null; }

/* ---------- utilidades estadísticas ---------- */
function median(a) {
  if (!a || !a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/* ---------- serie preparada (una sola vez por símbolo) ---------- */
function prepMove(candles) {
  if (!candles || candles.length < 120) return null;
  const closed = candles.slice(0, -1);           // sólo velas cerradas
  const c = closed.map(x => x.close), h = closed.map(x => x.high),
        l = closed.map(x => x.low),  o = closed.map(x => x.open),
        v = closed.map(x => x.volume);
  const n = c.length;
  const longP = n >= 230 ? 200 : Math.max(60, Math.floor(n / 3));
  const ema20 = emaArr(c, 20), ema50 = emaArr(c, 50), emaL = emaArr(c, longP);
  const rsi = rsiArr(c, 14), atr = atrArr(h, l, c, 14), volS = smaArr(v, 20);
  const di = adxArr(h, l, c, 14);
  const donLo = new Array(n).fill(null), donHi = new Array(n).fill(null);
  for (let i = MV.LB; i < n; i++) {
    let mn = Infinity, mx = -Infinity;
    for (let j = i - MV.LB; j < i; j++) { if (l[j] < mn) mn = l[j]; if (h[j] > mx) mx = h[j]; }
    donLo[i] = mn; donHi[i] = mx;
  }
  return { c, h, l, o, v, n, longP, ema20, ema50, emaL, rsi, atr, volS,
           adx: di.adx, pdi: di.pdi, mdi: di.mdi, donLo, donHi };
}

/* =====================================================================
   GATILLO — ¿está empezando el movimiento?
   Sólo usa precio y volumen, para poder calcularlo también en el pasado.
   side = -1 → caída (dump) · side = +1 → subida (bump)
   ===================================================================== */
function structTrigger(S, i, side, quiet) {
  const { c, h, l, o, v, rsi, ema20, atr, volS } = S;
  if (i < 40 || rsi[i] === null || ema20[i] === null || !atr[i]) return null;
  let s = 0; const why = [];
  const push = t => { if (!quiet) why.push(t); };

  // 1) Tensión: RSI en el extremo del lado contrario al movimiento esperado
  const R = side < 0 ? rsi[i] : 100 - rsi[i];
  if (R >= 82)      { s += 30; push(side < 0 ? `RSI ${rsi[i].toFixed(0)}: comprado hasta el extremo` : `RSI ${rsi[i].toFixed(0)}: vendido hasta el extremo`); }
  else if (R >= 73) { s += 22; push(side < 0 ? `RSI ${rsi[i].toFixed(0)}: sobrecomprado` : `RSI ${rsi[i].toFixed(0)}: sobrevendido`); }
  else if (R >= 65) { s += 11; push(`RSI ${rsi[i].toFixed(0)}`); }

  // 2) Distancia a su propia media (en ATR): el precio "estirado"
  const ext = (side < 0 ? 1 : -1) * (c[i] - ema20[i]) / atr[i];
  if (ext >= 2.5)      { s += 22; push(`precio ${ext.toFixed(1)} ATR ${side < 0 ? 'por encima' : 'por debajo'} de su media`); }
  else if (ext >= 1.6) { s += 15; push(`precio estirado ${ext.toFixed(1)} ATR de su media`); }
  else if (ext >= 1.0) { s += 7;  push('precio algo estirado de su media'); }

  // 3) Impulso previo (3 horas): lo que sube deprisa suele corregir
  if (i >= 12) {
    const imp = (side < 0 ? 1 : -1) * (c[i] / c[i - 12] - 1) * 100;
    if (imp >= 6)      { s += 14; push(`${imp.toFixed(1)}% ${side < 0 ? 'de subida' : 'de caída'} en 3 h`); }
    else if (imp >= 3) { s += 9;  push(`${imp.toFixed(1)}% en 3 h`); }
  }

  // 4) Vela de rechazo con volumen justo después del extremo
  let exIdx = i, exVal = side < 0 ? -Infinity : Infinity;
  for (let k = Math.max(0, i - 11); k <= i; k++) {
    const val = side < 0 ? h[k] : l[k];
    if (side < 0 ? val > exVal : val < exVal) { exVal = val; exIdx = k; }
  }
  const against = side < 0 ? (c[i] < o[i]) : (c[i] > o[i]);
  if (exIdx >= i - 5 && against && volS[i] && v[i] > 1.3 * volS[i]) {
    s += 15; push(`vela de ${side < 0 ? 'rechazo' : 'reacción'} con volumen tras el extremo`);
  }

  // 5) Giro confirmado: tres cierres seguidos en la dirección del movimiento
  if (i >= 3 && exIdx >= i - 8) {
    const turn = side < 0 ? (c[i] < c[i - 1] && c[i - 1] < c[i - 2])
                          : (c[i] > c[i - 1] && c[i - 1] > c[i - 2]);
    if (turn) { s += 10; push(`tres cierres seguidos ${side < 0 ? 'a la baja' : 'al alza'}`); }
  }

  // exIdx/exVal = dónde está el extremo sobre el que se monta la señal.
  // Ahí nace el movimiento, así que es la referencia para saber cuánto
  // camino se ha hecho ya y cuánto premio queda (ver moveProfile).
  return { score: Math.max(0, Math.min(100, s)), why, rsi: rsi[i], ext, exIdx, exVal };
}

/* =====================================================================
   AGUANTE — si el movimiento arranca, ¿tiene con qué durar?
   Esto es lo que separa una caída de 20 minutos de una de 8 horas.
   ===================================================================== */
function structPersist(S, i, side, quiet) {
  const { c, h, l, ema50, emaL, adx, pdi, mdi, atr, rsi, donLo, donHi, longP } = S;
  if (i < MV.WARM || !atr[i] || emaL[i] === null || ema50[i] === null ||
      adx[i] === null || rsi[i] === null || donLo[i] === null) return null;
  let s = 50; const pro = [], con = [];
  const yes = t => { if (!quiet) pro.push(t); };
  const no  = t => { if (!quiet) con.push(t); };
  const down = side < 0;

  // 1) ¿Va a favor o en contra de la tendencia de fondo? (peso máximo)
  const above = c[i] > emaL[i];
  if (down ? !above : above) {
    s += 20;
    yes(down ? `El precio ya está por debajo de su tendencia de fondo (media de ${longP} velas): la caída va a favor de la corriente.`
             : `El precio ya está por encima de su tendencia de fondo (media de ${longP} velas): la subida va a favor de la corriente.`);
  } else {
    s -= 24;
    no(down ? 'El precio todavía está POR ENCIMA de su tendencia de fondo: la caída va contra la corriente, y por eso lo más normal es que rebote pronto.'
            : 'El precio todavía está POR DEBAJO de su tendencia de fondo: la subida va contra la corriente y suele agotarse rápido.');
  }

  // 2) ¿Hacia dónde apunta ya la media de 50?
  if (i >= 16 && ema50[i - 16] !== null) {
    const sl = (ema50[i] - ema50[i - 16]) / atr[i];
    if ((down && sl <= -0.25) || (!down && sl >= 0.25)) { s += 10; yes(`La media de 50 velas ya apunta ${down ? 'hacia abajo' : 'hacia arriba'}.`); }
    else if ((down && sl >= 0.25) || (!down && sl <= -0.25)) { s -= 12; no('La media de 50 velas apunta en sentido contrario al movimiento.'); }
  }

  // 3) Estructura de máximos y mínimos (últimas 40 velas = 10 h)
  if (i >= 40) {
    const seg = (a, b) => {
      let mx = -Infinity, mn = Infinity;
      for (let k = a; k < b; k++) { if (h[k] > mx) mx = h[k]; if (l[k] < mn) mn = l[k]; }
      return { mx, mn };
    };
    const A = seg(i - 40, i - 20), B = seg(i - 20, i + 1);
    const lowerH = B.mx < A.mx, lowerL = B.mn < A.mn;
    if (down && lowerH && lowerL)        { s += 14; yes('Está haciendo máximos y mínimos cada vez más bajos: eso es una tendencia bajista de verdad, no un susto.'); }
    else if (!down && !lowerH && !lowerL) { s += 14; yes('Está haciendo máximos y mínimos cada vez más altos: tendencia alcista real.'); }
    else if (down && !lowerH && !lowerL)  { s -= 16; no('Sigue haciendo máximos y mínimos más altos: la estructura todavía es alcista.'); }
    else if (!down && lowerH && lowerL)   { s -= 16; no('Sigue haciendo máximos y mínimos más bajos: la estructura todavía es bajista.'); }
  }

  // 4) Fuerza de tendencia (ADX + dirección dominante)
  const strong = adx[i] >= 22;
  const dirOk = down ? (mdi[i] > pdi[i]) : (pdi[i] > mdi[i]);
  if (strong && dirOk)       { s += 14; yes(`Hay tendencia medible (ADX ${adx[i].toFixed(0)}) y la presión dominante es ${down ? 'vendedora' : 'compradora'}.`); }
  else if (strong && !dirOk) { s -= 14; no(`Hay tendencia medible (ADX ${adx[i].toFixed(0)}) pero manda el lado contrario.`); }
  else if (adx[i] < 17)      { s -= 10; no(`Sin tendencia (ADX ${adx[i].toFixed(0)}): el precio está en rango y los rangos devuelven el precio al centro.`); }

  // 5) Espacio libre hasta el siguiente nivel importante de las últimas 24 h
  const room = down ? (c[i] - donLo[i]) / atr[i] : (donHi[i] - c[i]) / atr[i];
  if (room >= 6)        { s += 14; yes(`Hay ${room.toFixed(1)} ATR de espacio libre hasta el ${down ? 'suelo' : 'techo'} de las últimas 24 h: sitio de sobra para correr.`); }
  else if (room >= 3)   { s += 6;  yes(`Espacio razonable (${room.toFixed(1)} ATR) hasta el siguiente nivel.`); }
  else if (room <= 1.2) { s -= 18; no(`Ya está pegado ${down ? 'al suelo' : 'al techo'} de las últimas 24 h (${room.toFixed(1)} ATR): casi todo el movimiento ya ocurrió, ahí es donde suele rebotar.`); }

  // 6) Agotamiento del propio lado
  const own = down ? rsi[i] : 100 - rsi[i];
  if (own <= 25)      { s -= 14; no(`El RSI ya está en ${rsi[i].toFixed(0)}: el movimiento ya está muy avanzado y lo que queda suele ser el rebote.`); }
  else if (own <= 33) { s -= 6;  no('El movimiento ya lleva bastante recorrido.'); }

  return { score: Math.max(0, Math.min(100, s)), pro, con, room, adx: adx[i] };
}

/* =====================================================================
   ESTUDIO HISTÓRICO — qué pasó las otras veces que esta misma moneda
   tuvo este mismo perfil. De aquí salen la duración esperada y el % de
   acierto que muestra la app. Todo medido sobre sus velas reales.
   ===================================================================== */
function moveClass(p) { return p >= 62 ? 2 : p >= 45 ? 1 : 0; }

/* Índices del pasado en los que se dio este mismo tipo de señal.
   Se comparte entre el estudio de resultados y el estudio del momento de
   entrada, para que los dos hablen exactamente de las mismas situaciones. */
function moveSignalIdx(S, side, cls, matchClass) {
  const out = []; let lastI = -999;
  for (let i = MV.WARM; i < S.n - MV.H - 1; i++) {
    const t = structTrigger(S, i, side, true);
    if (!t || t.score < 45) continue;
    const p = structPersist(S, i, side, true);
    if (!p) continue;
    if (matchClass && moveClass(p.score) !== cls) continue;
    if (i - lastI < MV.COOL) continue;            // no contar el mismo evento varias veces
    lastI = i;
    out.push(i);
  }
  return out;
}

function analogStudy(S, side, persistNow) {
  const cls = moveClass(persistNow);
  const collect = (matchClass) => {
    const out = [];
    for (const i of moveSignalIdx(S, side, cls, matchClass)) {
      const a = S.atr[i], entry = S.o[i + 1];
      if (!a || !entry) continue;
      const stopPx = side < 0 ? entry + MV.SL_ATR * a : entry - MV.SL_ATR * a;
      const tpPx   = side < 0 ? entry - MV.TP_ATR * a : entry + MV.TP_ATR * a;
      /* Aquí se miden DOS cosas distintas que antes se mezclaban:
           - el resultado de la OPERACIÓN (stop, objetivo o abierta al final)
           - la vida del MOVIMIENTO (cuánto siguió yendo antes de darse la vuelta)
         Antes el bucle hacía `break` al tocar objetivo y `life` se quedaba con
         su valor inicial MV.H, así que una operación que ganaba en 45 minutos
         se registraba como un movimiento de 8 horas y `sustained` salía true
         automáticamente. Eso convertía sustainedRate en el % de aciertos
         disfrazado de duración, y ése era justo el número que hacía a la app
         decir "CAÍDA LARGA, se puede dejar operando". Ahora el bucle recorre
         siempre todo el horizonte: la operación se cierra cuando se cierra,
         pero el movimiento se sigue midiendo. */
      let res = 'abierta', bars = MV.H, mfe = 0, best = entry;
      let life = null, done = false, lastK = 0, mfeTrade = null, moveMfe = null;
      for (let k = 1; k <= MV.H && i + k < S.n; k++) {
        lastK = k;
        const hi = S.h[i + k], lo = S.l[i + k], cl = S.c[i + k];
        const fav = side < 0 ? (entry - lo) / a : (hi - entry) / a;
        if (fav > mfe) mfe = fav;
        if (side < 0) { if (lo < best) best = lo; } else { if (hi > best) best = hi; }
        // ¿se acabó el movimiento? el precio CIERRA 1.2 ATR de vuelta desde su
        // mejor punto. Se usa el cierre y no la mecha para que una sola vela
        // ancha no dé por muerto un movimiento que sigue vivo.
        if (life === null && mfe >= 0.8) {
          const back = side < 0 ? (cl - best) / a : (best - cl) / a;
          if (back >= 1.2) { life = k; moveMfe = mfe; }
        }
        if (!done) {
          const stopHit = side < 0 ? hi >= stopPx : lo <= stopPx;
          const tpHit   = side < 0 ? lo <= tpPx   : hi >= tpPx;
          if (stopHit) {                                   // stop primero: criterio conservador
            // Si salta el stop, el movimiento que la señal anunciaba NO ocurrió:
            // se deja de medir aquí. Seguir midiendo después contaría a favor un
            // movimiento que llegó cuando ya estábamos fuera.
            res = 'stop'; bars = k; done = true; mfeTrade = mfe;
            if (life === null) { life = k; moveMfe = mfe; }
            break;
          }
          if (tpHit) {
            // Tocar objetivo cierra la OPERACIÓN, no el MOVIMIENTO: el bucle
            // sigue para medir cuánto duró de verdad. Ahí estaba el fallo que
            // convertía un acierto de 45 minutos en "un movimiento de 8 horas".
            res = 'tp'; bars = k; done = true; mfeTrade = mfe;
          }
        }
      }
      if (mfeTrade === null) mfeTrade = mfe;      // nunca se cerró: lo que llevaba
      if (moveMfe === null) moveMfe = mfe;        // nunca se dio la vuelta: todo
      // "went" = el movimiento llegó a arrancar de verdad (0.8 ATR a favor).
      // Si nunca arrancó, no tiene duración que medir: null, no MV.H. Decir
      // "duró 8 horas" de algo que se quedó plano fue el error original.
      const went = moveMfe >= 0.8;
      const lifeBars = went ? (life === null ? lastK : life) : null;
      out.push({ res, bars, mfe: mfeTrade, moveMfe, life: lifeBars, went,
                 sustained: went && lifeBars >= 12 && moveMfe >= 2 });
    }
    return out;
  };

  let sample = collect(true), matched = true;
  if (sample.length < 6) { sample = collect(false); matched = false; }
  if (!sample.length) return { n: 0 };
  const wins = sample.filter(x => x.res === 'tp').length;
  const stops = sample.filter(x => x.res === 'stop').length;
  const sust = sample.filter(x => x.sustained).length;
  const went = sample.filter(x => x.went);
  return {
    n: sample.length,
    matched,
    winRate: wins / sample.length * 100,
    stopRate: stops / sample.length * 100,
    sustainedRate: sust / sample.length * 100,
    // % de veces que el movimiento llegó a arrancar (se movió 0.8 ATR a favor)
    wentRate: went.length / sample.length * 100,
    wentN: went.length,
    // duración medida SÓLO sobre las veces que arrancó; null si nunca arrancó
    medLife: went.length ? median(went.map(x => x.life)) : null,
    medMfe: median(sample.map(x => x.mfe)),
    // recorrido típico contando SÓLO las veces que el movimiento arrancó, y
    // medido hasta que el movimiento se dio la vuelta (no hasta que se cerró
    // la operación): es la vara con la que se mide cuánto del camino ya se ha
    // hecho, y lo recorrido se mide igual, así que la división tiene sentido.
    medMfeWent: went.length ? median(went.map(x => x.moveMfe)) : null,
    medBarsWin: median(sample.filter(x => x.res === 'tp').map(x => x.bars)),
    expR: (wins * 2 - stops * 1) / sample.length,
  };
}

/* Simula una operación con stop y objetivo fijos en ATR.
   Devuelve el resultado y su R (2 si gana, -1 si salta el stop, y si el
   horizonte se acaba abierta, la R que llevaba en ese momento). */
function runTrade(S, side, entry, a, from, until) {
  const stopPx = side < 0 ? entry + MV.SL_ATR * a : entry - MV.SL_ATR * a;
  const tpPx   = side < 0 ? entry - MV.TP_ATR * a : entry + MV.TP_ATR * a;
  let last = from - 1;
  for (let k = from; k <= until && k < S.n; k++) {
    last = k;
    const hi = S.h[k], lo = S.l[k];
    if (side < 0 ? hi >= stopPx : lo <= stopPx) return { res: 'stop', R: -1 };
    if (side < 0 ? lo <= tpPx   : hi >= tpPx)   return { res: 'tp',   R: 2 };
  }
  if (last < from) return null;
  const R = (side < 0 ? entry - S.c[last] : S.c[last] - entry) / (MV.SL_ATR * a);
  return { res: 'abierta', R: Math.max(-1, Math.min(2, R)) };
}

function entryTiming(S, side, persistNow) {
  const cls = moveClass(persistNow);
  let idx = moveSignalIdx(S, side, cls, true), matched = true;
  if (idx.length < 6) { idx = moveSignalIdx(S, side, cls, false); matched = false; }
  if (idx.length < ET.MIN_N) return { n: 0 };

  const now = [], pull = [], late = [];
  let fills = 0, missedGood = 0;
  for (const i of idx) {
    const a = S.atr[i], e0 = S.o[i + 1];
    if (!a || !e0) continue;
    const end = i + MV.H;

    const rNow = runTrade(S, side, e0, a, i + 1, end);
    if (!rNow) continue;
    now.push(rNow);

    // TARDE: la misma señal, pero entrando una hora después.
    const eLate = S.o[i + 1 + ET.LATE];
    if (eLate) {
      const rLate = runTrade(S, side, eLate, a, i + 1 + ET.LATE, end);
      if (rLate) late.push(rLate);
    }

    // RETROCESO: orden límite a 0.5 ATR en contra, válida 1 hora.
    const pbPx = side < 0 ? e0 + ET.PB_ATR * a : e0 - ET.PB_ATR * a;
    let hit = -1;
    for (let k = i + 1; k <= i + ET.PB_WAIT && k < S.n; k++) {
      if (side < 0 ? S.h[k] >= pbPx : S.l[k] <= pbPx) { hit = k; break; }
    }
    if (hit >= 0) {
      // La orden se llena dentro de esa misma vela, así que esa vela ya cuenta:
      // si el precio siguió hasta el stop en la misma vela, eso pasó de verdad.
      // Saltársela regalaba R a la opción "esperar" — y como esa opción se
      // compara cara a cara con "entrar ya" (que sí incluye su vela de entrada),
      // el regalo torcía el consejo que aparece en pantalla.
      const rPb = runTrade(S, side, pbPx, a, hit, end);
      if (rPb) { fills++; pull.push(rPb); }
      else pull.push({ res: 'nofill', R: 0 });
    } else {
      // No entrar también es un resultado: 0 R. Y si esa que se escapó era
      // ganadora, hay que decirlo, porque es el coste de esperar.
      if (rNow.res === 'tp') missedGood++;
      pull.push({ res: 'nofill', R: 0 });
    }
  }
  if (now.length < ET.MIN_N) return { n: 0 };

  const stat = arr => {
    if (!arr.length) return null;
    const w = arr.filter(x => x.res === 'tp').length;
    const f = arr.filter(x => x.res !== 'nofill').length;
    return {
      n: arr.length,
      winRate: f ? w / f * 100 : 0,               // acierto sobre las que sí se entró
      expR: arr.reduce((s, x) => s + x.R, 0) / arr.length,
    };
  };
  const sNow = stat(now), sPull = stat(pull), sLate = stat(late);
  const fillRate = fills / now.length * 100;
  const missRate = 100 - fillRate;

  /* Consejo medido.

     OJO con una trampa aritmética que estuvo aquí: las veces que la orden
     límite NO se llena puntúan 0 R (no operas, no ganas ni pierdes). Eso es
     correcto como política, pero significa que si entrar de inmediato PIERDE
     dinero, "no entrar" gana la comparación por pura aritmética, sin que el
     retroceso haya demostrado nada. La app acababa diciendo "espera un
     retroceso" cuando lo medido decía "esta señal no funciona en esta moneda".
     Por eso esperar sólo se recomienda si el propio retroceso ganó dinero. */
  let advice = 'ya';
  if (sPull && sPull.expR > 0.1 && sPull.expR > sNow.expR + 0.15 && fillRate >= 45)
    advice = 'retroceso';
  // Si NINGUNA de las tres formas de entrar ganó dinero en el pasado de esta
  // moneda, el consejo honesto no es "espera": es no tomar esta señal.
  const bestExp = Math.max(sNow.expR,
                           sPull ? sPull.expR : -Infinity,
                           sLate ? sLate.expR : -Infinity);
  if (advice !== 'retroceso' && bestExp <= 0) advice = 'evitar';
  // ¿Caduca? Dudar una hora convierte una señal buena en mala.
  const decays = !!(sLate && sNow.expR > 0 && sLate.expR < sNow.expR - 0.25);

  return {
    n: now.length, matched,
    now: sNow, pull: sPull, late: sLate,
    fillRate, missRate, missedGood, bestExp,
    pbAtr: ET.PB_ATR, waitBars: ET.PB_WAIT, lateBars: ET.LATE,
    advice, decays,
  };
}

/* ---------- texto de duración legible ---------- */
function durationText(bars) {
  if (bars === null || bars === undefined) return null;
  const m = Math.round(bars * MV.MIN);
  if (m < 45) return `unos ${Math.max(15, Math.round(m / 5) * 5)} minutos`;
  if (m < 100) return 'alrededor de 1 hora';
  const hLo = Math.floor(m / 60), hHi = Math.ceil(m / 60) + 1;
  if (hLo >= 7) return 'más de 7 horas (todo el horizonte medido)';
  return `entre ${hLo} y ${hHi} horas`;
}

/* =====================================================================
   PERFIL COMPLETO DE UN MOVIMIENTO
   ===================================================================== */
function moveProfile(candles, side, ctx, withAnalog) {
  const S = prepMove(candles);
  if (!S) return null;
  const i = S.n - 1;
  const t = structTrigger(S, i, side, false);
  const p = structPersist(S, i, side, false);
  if (!t || !p) return null;
  const f = flowAdjust(side, ctx);
  const trigger = Math.max(0, Math.min(100, t.score + f.t));
  const persist = Math.max(0, Math.min(100, p.score + f.p));
  const analog = withAnalog ? analogStudy(S, side, p.score) : { n: 0 };
  const timing = withAnalog ? entryTiming(S, side, p.score) : { n: 0 };

  /* --- ¿la señal acaba de aparecer o el movimiento ya lleva recorrido? ---
     El gatillo es un detector de agotamiento: se enciende en el extremo y se
     apaga en cuanto el movimiento arranca de verdad. Por eso contar "velas con
     el gatillo encendido" no mide nada. Lo que sí lo mide es el extremo mismo:
     ahí nace el movimiento. Lo recorrido desde entonces es camino gastado — el
     stop sigue midiendo lo mismo, pero queda menos premio por delante. */
  const atrNow = S.atr[i];
  const exIdx = (t.exIdx === undefined || t.exIdx === null) ? i : t.exIdx;
  const sinceBars = Math.max(0, i - exIdx);
  // Precio al que se habría entrado tomando la señal en el extremo: es la misma
  // convención de entrada que usa el estudio histórico, así que las dos cifras
  // (lo recorrido y el recorrido típico) hablan de lo mismo y se pueden dividir.
  const refPx = sinceBars > 0 ? S.o[exIdx + 1] : null;
  /* Lo recorrido hay que medirlo EXACTAMENTE igual que el recorrido típico con
     el que se va a comparar, o la división no significa nada. El historial mide
     la excursión MÁXIMA a favor (mechas incluidas) en ATR del momento de la
     señal. Antes aquí se medía de cierre a cierre y con el ATR de AHORA: tres
     sesgos distintos, los tres empujando el resultado hacia abajo, así que el
     freno de "se te pasó el momento" casi nunca llegaba a saltar. */
  const aRef = S.atr[exIdx] || atrNow;
  let movedAtr = 0;
  if (refPx && aRef && sinceBars > 0) {
    let mx = -Infinity;
    for (let k = exIdx + 1; k <= i; k++) {
      const fav = side < 0 ? (refPx - S.l[k]) / aRef : (S.h[k] - refPx) / aRef;
      if (fav > mx) mx = fav;
    }
    if (isFinite(mx)) movedAtr = mx;
  }
  /* Vara de medir: el recorrido típico de las veces que el movimiento SÍ
     arrancó. Sin suelo artificial en 1 ATR — ese suelo inflaba el denominador y
     hundía el porcentaje.
     Y hace falta que haya arrancado unas cuantas veces. El apaño de tirar de
     `medMfe` (la mediana de TODAS las veces, arrancaran o no) cuando no había
     ninguna que arrancara metía por la puerta de atrás un denominador
     minúsculo: con medMfe = 0.20 y 3.5 ATR recorridos salía "llevas hecho el
     1779% del camino". Eso no es una medida, es una división por casi cero.
     Si en el historial de esta moneda este perfil nunca llegó a moverse, no
     existe "el recorrido típico" y no se puede decir cuánto llevas hecho: null
     es la respuesta honesta, y la pantalla ya sabe callarse con null. */
  const fullMove = (analog.n >= 5 && analog.wentN >= 3 && analog.medMfeWent > 0.2)
    ? analog.medMfeWent : null;
  const progress = fullMove ? Math.max(0, movedAtr) / fullMove : null;

  // Clasificación: la duración la deciden el AGUANTE y el historial, no el gatillo
  let kind, kindLabel, kindWhy;
  const histSust = analog.n >= 5 ? analog.sustainedRate : null;
  const histWent = analog.n >= 5 ? analog.wentRate : null;
  // Si el AGUANTE calculado es alto pero el historial de la propia moneda dice
  // que ese mismo perfil nunca llegó a nada, manda el historial. Y hay que
  // decirlo con todas las letras, porque si no el usuario ve AGUANTE 89 junto
  // a la etiqueta CORTA y no entiende nada.
  const histVeto = (histSust !== null && histSust < 25) || (histWent !== null && histWent < 35);
  const vetoNote = (histVeto && persist >= 60)
    ? ` Ojo: el AGUANTE sale alto por la estructura del precio, pero manda el historial de esta misma moneda, y ahí este perfil no llegó a nada. Por eso la clasifico como corta.`
    : '';
  if (trigger < 42) {
    kind = 'ninguno'; kindLabel = 'sin señal';
    kindWhy = 'No hay condiciones de movimiento ahora mismo.';
  } else if (persist >= 60 && !histVeto && (histSust === null || histSust >= 40)) {
    kind = 'sostenido'; kindLabel = side < 0 ? 'CAÍDA LARGA' : 'SUBIDA LARGA';
    kindWhy = `El movimiento va a favor de la tendencia de fondo y tiene espacio por delante. ${histSust !== null ? `De las ${analog.n} veces que esta moneda tuvo este mismo perfil, ${Math.round(analog.sustainedRate)}% siguieron ${side < 0 ? 'cayendo' : 'subiendo'} varias horas.` : 'Hay poca muestra histórica para confirmarlo.'}`;
  } else if (persist <= 42 || histVeto) {
    kind = 'rapido'; kindLabel = side < 0 ? 'CAÍDA CORTA' : 'SUBIDA CORTA';
    kindWhy = `Es una sacudida: el movimiento va contra la corriente de fondo o ya no le queda espacio. ${histSust !== null ? `Sólo ${Math.round(analog.sustainedRate)}% de las ${analog.n} veces anteriores duró varias horas.` : ''}${vetoNote} Si entras, entra sabiendo que hay que salir pronto.`;
  } else {
    kind = 'medio'; kindLabel = side < 0 ? 'CAÍDA MEDIA' : 'SUBIDA MEDIA';
    kindWhy = 'Señales mezcladas: puede durar un rato pero no hay confirmación de tendencia de fondo. Trátalo como operación corta y vigílalo.';
  }

  // Duración: medida del historial cuando hay muestra suficiente, pero SIEMPRE
  // acotada por la clasificación. Anunciar "7 horas" en una señal etiquetada
  // como CAÍDA CORTA sería justo la contradicción que hizo perder dinero.
  const rawHold = (analog.n >= 5 && analog.medLife)
    ? analog.medLife
    : (kind === 'sostenido' ? 16 : kind === 'medio' ? 8 : 4);
  const cap = kind === 'sostenido' ? MV.H : kind === 'medio' ? 12 : 6;
  const holdBars = Math.max(1, Math.min(rawHold, cap));
  const holdText = durationText(holdBars);
  const maxHoldBars = Math.max(4, Math.round(holdBars * 1.6));

  /* --- consejo final sobre el momento de entrar ---
     Manda lo que ya ocurrió: si el precio ya recorrió casi todo lo que suele
     recorrer, da igual lo bueno que sea el resto, entrar ahí es pagar el
     precio caro y quedarse con el poco premio que sobra. */
  const tooLate = progress !== null && progress >= 0.8;
  const entryWhen = tooLate ? 'tarde'
    : (timing.n >= ET.MIN_N && timing.advice === 'evitar') ? 'evitar'
    : (timing.n >= ET.MIN_N && timing.advice === 'retroceso') ? 'retroceso' : 'ya';
  const pbPrice = atrNow ? (side < 0 ? S.c[i] + ET.PB_ATR * atrNow : S.c[i] - ET.PB_ATR * atrNow) : null;
  // ventana antes de que la señal deje de servir
  const validBars = timing.decays ? ET.LATE : Math.max(ET.PB_WAIT, Math.round(holdBars / 2));

  return {
    side, trigger, persist, kind, kindLabel, kindWhy,
    analog, holdBars, holdText, maxHoldBars,
    timing, sinceBars, movedAtr, progress, entryWhen, pbPrice, validBars,
    triggerWhy: t.why,
    pro: [...p.pro, ...f.pro],
    con: [...p.con, ...f.con],
    rsi: t.rsi, ext: t.ext, room: p.room, adx: p.adx,
    atr: S.atr[i], price: S.c[i],
    estMovePct: analog.n >= 5 && analog.medMfe ? analog.medMfe * S.atr[i] / S.c[i] * 100 : null,
  };
}

/* =====================================================================
   AJUSTES POR FLUJOS (sólo disponibles para AHORA, no para el pasado)
   Aquí vive la lección más importante de la versión anterior:
     · interés abierto SUBIENDO mientras cae el precio = cortos nuevos = dura
     · interés abierto CAYENDO mientras cae el precio  = largos cerrando
       (liquidaciones) = sacudida rápida que después rebota
     · funding muy alto = hay mucho largo apalancado que barrer, pero eso
       produce una caída RÁPIDA, no una tendencia
   ===================================================================== */
function flowAdjust(side, ctx) {
  let t = 0, p = 0; const pro = [], con = [];
  if (!ctx) return { t, p, pro, con };
  const down = side < 0;

  // Interés abierto contra precio (últimas ~4 h)
  if (ctx.oiChg !== null && ctx.oiChg !== undefined && ctx.priceChg4h !== null) {
    const priceWithUs = down ? ctx.priceChg4h < -0.3 : ctx.priceChg4h > 0.3;
    if (ctx.oiChg >= 2 && priceWithUs) {
      p += 16; t += 6;
      pro.push(`El interés abierto sube ${pct(ctx.oiChg, 1)} mientras el precio ${down ? 'cae' : 'sube'}: está entrando dinero NUEVO ${down ? 'al corto' : 'al largo'}. Eso es lo que sostiene un movimiento largo.`);
    } else if (ctx.oiChg <= -2.5 && priceWithUs) {
      p -= 20; t += 8;
      con.push(`El interés abierto CAE ${pct(ctx.oiChg, 1)} mientras el precio ${down ? 'cae' : 'sube'}: no son ${down ? 'cortos nuevos' : 'compras nuevas'}, son ${down ? 'largos cerrando y liquidándose' : 'cortos cerrando'}. Este tipo de movimiento es rápido y suele darse la vuelta. ⚠️ Éste es exactamente el caso que hay que evitar dejar abierto.`);
    } else if (ctx.oiChg >= 3 && !priceWithUs) {
      p -= 8;
      con.push('El interés abierto sube pero a favor del lado contrario.');
    }
  }

  // Funding
  if (ctx.funding !== null && ctx.funding !== undefined) {
    const f = ctx.funding;
    if (down) {
      if (f >= 0.08)       { t += 18; p -= 12; con.push(`Funding ${pct(f, 3)}: hay muchísimos largos apalancados pagando por estar dentro. Cuando se barren, la caída es fuerte pero CORTA — es una limpieza, no una tendencia.`); }
      else if (f >= 0.04)  { t += 12; p -= 4;  con.push(`Funding ${pct(f, 3)}: largos cargados, riesgo de limpieza rápida.`); }
      else if (f <= -0.06) { t -= 12; p -= 18; con.push(`Funding ${pct(f, 3)}: los cortos ya están saturados y son ellos los que pagan. Aquí lo que suele venir es un rebote violento al alza (short squeeze), no más caída.`); }
      else if (f >= 0 && f <= 0.03) { p += 6; pro.push('Funding tranquilo: todavía queda gente larga por rendirse, la caída tiene recorrido.'); }
    } else {
      if (f <= -0.08)      { t += 18; p -= 12; con.push(`Funding ${pct(f, 3)}: hay muchísimos cortos pagando. Cuando se barren la subida es fuerte pero CORTA.`); }
      else if (f <= -0.04) { t += 12; p -= 4;  con.push(`Funding ${pct(f, 3)}: cortos cargados, posible rebote rápido.`); }
      else if (f >= 0.06)  { t -= 12; p -= 18; con.push(`Funding ${pct(f, 3)}: los largos ya están saturados y pagan. Riesgo de que la subida se corte de golpe.`); }
      else if (f <= 0 && f >= -0.03) { p += 6; pro.push('Funding tranquilo: la subida no está sobrecargada de apalancamiento.'); }
    }
  }

  // Ballenas (top traders de Binance por margen)
  if (ctx.whaleNow !== null && ctx.whaleNow !== undefined) {
    const w = ctx.whaleNow;
    if (down) {
      if (w <= 0.75)      { t += 12; p += 10; pro.push(`Los grandes traders están posicionados en corto (ratio ${w.toFixed(2)}).`); }
      else if (w <= 0.95) { t += 6;  p += 5;  pro.push(`Los grandes traders se inclinan al corto (ratio ${w.toFixed(2)}).`); }
      else if (w >= 1.7)  { t -= 10; p -= 12; con.push(`Los grandes traders están claramente largos (ratio ${w.toFixed(2)}): apostar a una caída larga es ir contra ellos.`); }
    } else {
      if (w >= 1.5)       { t += 12; p += 10; pro.push(`Los grandes traders están posicionados en largo (ratio ${w.toFixed(2)}).`); }
      else if (w >= 1.1)  { t += 6;  p += 5;  pro.push(`Los grandes traders se inclinan al largo (ratio ${w.toFixed(2)}).`); }
      else if (w <= 0.7)  { t -= 10; p -= 12; con.push(`Los grandes traders están claramente cortos (ratio ${w.toFixed(2)}).`); }
    }
    if (ctx.whalePrev !== null && ctx.whalePrev > 0) {
      const chg = ctx.whaleNow / ctx.whalePrev - 1;
      if (down && chg <= -0.08) { t += 8; p += 6; pro.push('Los grandes traders están soltando largos en las últimas horas.'); }
      if (!down && chg >= 0.08) { t += 8; p += 6; pro.push('Los grandes traders están construyendo largos en las últimas horas.'); }
    }
  }

  return { t, p, pro, con };
}

/* ================= UTILIDADES ================= */
async function pedir(ruta, ms = 15000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(FAPI + ruta, { signal: ctrl.signal });
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
    return await r.json();
  } finally { clearTimeout(t); }
}
function velas(raw) {
  return raw.map(k => ({ time: Math.floor(k[0] / 1000), open: +k[1], high: +k[2],
                         low: +k[3], close: +k[4], volume: +k[5] }));
}
function num(x) {
  if (x === null || x === undefined || isNaN(x)) return '—';
  const a = Math.abs(x);
  const d = a >= 1000 ? 2 : a >= 1 ? 4 : a >= 0.001 ? 6 : 8;
  return Number(x).toLocaleString('en-US', { maximumFractionDigits: d });
}
function pct(x, d = 1) { return (x >= 0 ? '+' : '') + Number(x).toFixed(d) + '%'; }

const app = { simbolos: [], lado: -1, datos: { '-1': null, '1': null },
              foto: null, escaneando: false, hora: null };

/* ================= ESCANEO ================= */
async function escanear(lado) {
  const [tickers, primas] = await Promise.all([
    pedir('/fapi/v1/ticker/24hr'),
    pedir('/fapi/v1/premiumIndex').catch(() => []),
  ]);
  const validos = new Set(app.simbolos);
  const funding = {};
  (Array.isArray(primas) ? primas : []).forEach(p => {
    if (p.symbol) funding[p.symbol] = parseFloat(p.lastFundingRate) * 100;
  });

  const activas = (Array.isArray(tickers) ? tickers : [])
    .filter(t => validos.has(t.symbol) && parseFloat(t.quoteVolume) > 8e6);
  const porVolumen = [...activas]
    .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume)).slice(0, 28);
  const porMovimiento = [...activas].sort((a, b) => lado < 0
    ? parseFloat(b.priceChangePercent) - parseFloat(a.priceChangePercent)
    : parseFloat(a.priceChangePercent) - parseFloat(b.priceChangePercent)).slice(0, 14);
  const candidatas = [...new Map([...porVolumen, ...porMovimiento].map(t => [t.symbol, t])).values()];

  /* Primera pasada, barata: velas de 5 minutos para ver dónde está más
     encendido el gatillo. Sólo las mejores pasan a la segunda. */
  const previo = await Promise.all(candidatas.map(async t => {
    try {
      const S = prepMove(velas(await pedir(`/fapi/v1/klines?symbol=${t.symbol}&interval=5m&limit=200`)));
      if (!S) return null;
      const tr = structTrigger(S, S.n - 1, lado, true);
      return tr ? { t, pre: tr.score } : null;
    } catch (e) { return null; }
  }));
  const finalistas = previo.filter(Boolean).sort((a, b) => b.pre - a.pre).slice(0, 7);

  /* Segunda pasada: historial de 15 minutos, ballenas, interés abierto y la
     tendencia de 4 horas. */
  const completo = await Promise.all(finalistas.map(async ({ t }) => {
    try {
      const [k15, oiH, top, k4h] = await Promise.all([
        pedir(`/fapi/v1/klines?symbol=${t.symbol}&interval=15m&limit=700`).then(velas),
        pedir(`/futures/data/openInterestHist?symbol=${t.symbol}&period=15m&limit=17`).catch(() => null),
        pedir(`/futures/data/topLongShortPositionRatio?symbol=${t.symbol}&period=15m&limit=17`).catch(() => null),
        pedir(`/fapi/v1/klines?symbol=${t.symbol}&interval=4h&limit=250`).then(velas).catch(() => null),
      ]);

      let oiChg = null;
      if (Array.isArray(oiH) && oiH.length > 1) {
        const a = parseFloat(oiH[0].sumOpenInterest), b = parseFloat(oiH[oiH.length - 1].sumOpenInterest);
        if (a > 0) oiChg = (b / a - 1) * 100;
      }
      let ballena = null, ballenaAntes = null;
      if (Array.isArray(top) && top.length) {
        ballena = parseFloat(top[top.length - 1].longShortRatio);
        ballenaAntes = top.length > 1 ? parseFloat(top[0].longShortRatio) : null;
      }
      const cerradas = k15.slice(0, -1);
      const chg4h = cerradas.length > 17
        ? (cerradas[cerradas.length - 1].close / cerradas[cerradas.length - 17].close - 1) * 100 : null;

      const perfil = moveProfile(k15, lado, {
        funding: funding[t.symbol] ?? null, oiChg, priceChg4h: chg4h, whaleNow: ballena, whalePrev: ballenaAntes,
      }, true);
      if (!perfil) return null;

      /* Tendencia de 4 horas, calculada directamente de las medias. No hace
         falta nada más: sirve para decir si la caída que anuncia el radar iría
         a favor o en contra de la corriente de fondo. */
      let tendencia = null;
      if (k4h && k4h.length > 60) {
        const c = k4h.slice(0, -1).map(x => x.close);
        const e20 = last(emaArr(c, 20)), e50 = last(emaArr(c, 50));
        const eL = last(emaArr(c, c.length >= 210 ? 200 : 100));
        if (eL !== null) {
          tendencia = (c[c.length - 1] > eL ? 0.6 : -0.6) +
                      (e20 !== null && e50 !== null ? (e20 > e50 ? 0.4 : -0.4) : 0);
        }
      }

      return { symbol: t.symbol, precio: parseFloat(t.lastPrice),
               chg24: parseFloat(t.priceChangePercent),
               ballena, ballenaAntes, oiChg, funding: funding[t.symbol] ?? null,
               tendencia, ...perfil };
    } catch (e) { return null; }
  }));

  const rango = k => k === 'sostenido' ? 2 : k === 'medio' ? 1 : 0;
  const salida = completo.filter(Boolean)
    .filter(r => r.trigger >= 42 && r.kind !== 'ninguno')
    .sort((a, b) => (rango(b.kind) - rango(a.kind)) ||
      ((b.trigger * 0.55 + b.persist * 0.45) - (a.trigger * 0.55 + a.persist * 0.45)));
  salida.miradas = completo.filter(Boolean).length;
  salida.intentadas = finalistas.length;
  return salida;
}

/* Foto del posicionamiento del dinero grande en el mercado.
   No predice nada: cuenta cuántas de las monedas más negociadas tienen a los
   grandes traders colocados a cada lado. */
async function fotoMercado() {
  const tickers = await pedir('/fapi/v1/ticker/24hr');
  const validos = new Set(app.simbolos);
  const lista = (Array.isArray(tickers) ? tickers : [])
    .filter(t => validos.has(t.symbol) && parseFloat(t.quoteVolume) > 1e7)
    .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
    .slice(0, 25);

  const filas = (await Promise.all(lista.map(async t => {
    try {
      const top = await pedir(`/futures/data/topLongShortPositionRatio?symbol=${t.symbol}&period=1h&limit=25`);
      if (!Array.isArray(top) || !top.length) return null;
      const ahora = parseFloat(top[top.length - 1].longShortRatio);
      const antes = parseFloat(top[0].longShortRatio);
      if (!isFinite(ahora) || ahora <= 0) return null;
      return { symbol: t.symbol, ballena: ahora, chg24: parseFloat(t.priceChangePercent),
               cambio: (isFinite(antes) && antes > 0) ? (ahora / antes - 1) * 100 : null };
    } catch (e) { return null; }
  }))).filter(Boolean);

  if (!filas.length) return { error: 'No se pudo traer el posicionamiento.' };
  return {
    total: filas.length,
    cortas: filas.filter(x => x.ballena < 0.9).length,
    largas: filas.filter(x => x.ballena > 1.15).length,
    soltando: filas.filter(x => x.cambio !== null && x.cambio <= -8).length,
    cargando: filas.filter(x => x.cambio !== null && x.cambio >= 8).length,
    mediana: median(filas.map(x => x.ballena)),
    detalle: filas.sort((a, b) => a.ballena - b.ballena),
  };
}

/* ================= PINTAR ================= */
function pintarFoto() {
  const el = document.getElementById('foto');
  const P = app.foto;
  if (P === 'cargando') { el.innerHTML = `<div class="foto"><span class="spinner"></span>Mirando dónde está el dinero grande…</div>`; return; }
  if (!P) { el.innerHTML = ''; return; }
  if (P.error) { el.innerHTML = `<div class="foto"><div class="d">⚠️ ${P.error}</div></div>`; return; }

  const sesgo = P.cortas > P.largas * 1.5 ? 'baja' : P.largas > P.cortas * 1.5 ? 'alza' : 'nada';
  const t = sesgo === 'baja'
    ? `🔻 El dinero grande está colocado a la BAJA en ${P.cortas} de ${P.total} monedas`
    : sesgo === 'alza'
      ? `🔺 El dinero grande está colocado al ALZA en ${P.largas} de ${P.total} monedas`
      : `➖ El dinero grande está repartido`;
  const color = sesgo === 'baja' ? 'var(--red)' : sesgo === 'alza' ? 'var(--green)' : 'var(--muted)';

  el.innerHTML = `<div class="foto">
    <div class="t" style="color:${color}">${t}</div>
    <div class="d">Entre las ${P.total} más negociadas: <b style="color:var(--red)">${P.cortas} cortas</b>,
      <b style="color:var(--green)">${P.largas} largas</b>, ${P.total - P.cortas - P.largas} repartidas.
      Ratio típico <b>${P.mediana.toFixed(2)}</b> (menos de 1 = más corto que largo).
      En 24 h han soltado largos en ${P.soltando} y cargado en ${P.cargando}.</div>
    <details><summary>Ver las ${P.total} monedas</summary>
      <table><thead><tr><th>Moneda</th><th>Ballenas</th><th>24 h</th><th>Precio</th></tr></thead><tbody>
      ${P.detalle.map(d => `<tr>
        <td><b>${d.symbol.replace('USDT','')}</b></td>
        <td style="color:${d.ballena < 0.9 ? 'var(--red)' : d.ballena > 1.15 ? 'var(--green)' : 'var(--muted)'}">${d.ballena.toFixed(2)}</td>
        <td style="color:${d.cambio === null ? 'var(--muted)' : d.cambio < 0 ? 'var(--red)' : 'var(--green)'}">${d.cambio === null ? '—' : pct(d.cambio, 0)}</td>
        <td style="color:${d.chg24 >= 0 ? 'var(--green)' : 'var(--red)'}">${pct(d.chg24)}</td></tr>`).join('')}
      </tbody></table></details>
  </div>`;
}

function lineaBallenas(r, lado) {
  if (r.ballena === null || !isFinite(r.ballena))
    return `<div class="linea">🐋 Binance no publica el posicionamiento de los grandes traders para esta moneda.</div>`;
  const cortas = r.ballena < 0.9, largas = r.ballena > 1.15;
  const aFavor = lado < 0 ? cortas : largas;
  const contra = lado < 0 ? largas : cortas;
  const nivel = cortas ? `${(1 / r.ballena).toFixed(2)} veces más posición corta que larga`
              : largas ? `${r.ballena.toFixed(2)} veces más posición larga que corta`
              : `casi empatados (${r.ballena.toFixed(2)})`;
  let mov = '';
  if (r.ballenaAntes && isFinite(r.ballenaAntes) && r.ballenaAntes > 0) {
    const c = (r.ballena / r.ballenaAntes - 1) * 100;
    if (Math.abs(c) >= 5)
      mov = c < 0 ? ` Están <b>soltando</b> largos (${pct(c, 0)} en las últimas horas).`
                  : ` Están <b>cargando</b> largos (${pct(c, 0)} en las últimas horas).`;
  }
  const cabeza = aFavor ? '🐋 <b>El dinero grande está del mismo lado</b>'
               : contra ? '🐋 <b>El dinero grande está al otro lado</b>'
               : '🐋 <b>El dinero grande no se moja</b>';
  return `<div class="linea ${aFavor ? 'ok' : contra ? 'no' : ''}">${cabeza}: ${nivel}.${mov}</div>`;
}

function lineaTendencia(r, lado) {
  if (r.tendencia === null) return '';
  const baja = r.tendencia < -0.3, sube = r.tendencia > 0.3;
  if (!baja && !sube) return `<div class="linea">📊 La tendencia de 4 horas está plana.</div>`;
  const aFavor = lado < 0 ? baja : sube;
  return `<div class="linea ${aFavor ? 'ok' : 'no'}">📊 La tendencia de 4 horas es <b>${baja ? 'bajista' : 'alcista'}</b>${
    aFavor ? ', o sea a favor de este movimiento.'
           : `, o sea <b>en contra</b>. Ir contra la corriente de fondo es lo que más caro sale.`}</div>`;
}

function medidor(k, v, color) {
  return `<div class="med"><div class="k">${k}</div><div class="v" style="color:${color}">${Math.round(v)}</div>
    <div class="barra"><i style="width:${Math.max(0, Math.min(100, v))}%;background:${color}"></i></div></div>`;
}

function pintarLista() {
  const el = document.getElementById('lista');
  const lado = app.lado;
  const filas = app.datos[String(lado)];
  document.body.className = lado > 0 ? 'sube' : '';

  if (filas === null) { el.innerHTML = `<span class="spinner"></span>Escaneando los futuros más negociados…`; return; }
  if (filas.fallo) {
    el.innerHTML = `<div class="aviso">⚠️ <b>El escaneo falló</b>: no se pudieron traer los datos de Binance. El radar está vacío porque no ha podido mirar, no porque no haya nada.</div>`;
    return;
  }
  if (!filas.length) {
    el.innerHTML = `<div class="vacio">✅ Ninguna de las <b>${filas.miradas ?? 0}</b> monedas analizadas cumple ahora mismo las condiciones de ${lado < 0 ? 'caída' : 'subida'}. Que esté vacío es buena señal: no hay nada que forzar.</div>`;
    return;
  }

  el.className = '';
  el.innerHTML = filas.map(r => {
    const etiqueta = r.kind === 'sostenido' ? (lado < 0 ? 'CAÍDA LARGA' : 'SUBIDA LARGA')
                   : r.kind === 'medio' ? (lado < 0 ? 'CAÍDA MEDIA' : 'SUBIDA MEDIA')
                   : (lado < 0 ? 'CAÍDA CORTA' : 'SUBIDA CORTA');
    const colorTipo = r.kind === 'sostenido' ? (lado < 0 ? 'var(--red)' : 'var(--green)')
                    : r.kind === 'medio' ? 'var(--yellow)' : 'var(--muted)';
    const sub = r.kind === 'sostenido' ? 'puede durar horas'
              : r.kind === 'medio' ? 'vigílala de cerca' : 'entra y sale rápido';

    const a = r.atr, p = r.precio;
    const stop = lado < 0 ? p + 1.5 * a : p - 1.5 * a;
    const obj  = lado < 0 ? p - 3 * a : p + 3 * a;

    const A = r.analog;
    const hist = (A && A.n >= 5)
      ? `📖 En las <b>${A.n} veces</b> que esta moneda tuvo este mismo perfil: llegó al objetivo el <b>${A.winRate.toFixed(0)}%</b> de las veces${
          A.medLife ? `, y el movimiento duró <b>${durationText(A.medLife)}</b> de media` : ''}.`
      : '📖 Esta moneda no tiene historial suficiente de este perfil para decir qué suele pasar.';

    return `<div class="moneda ${r.kind}">
      <div class="fila1">
        <span class="sym">${r.symbol.replace('USDT', '')}</span>
        <span class="precio">${num(p)} · ${pct(r.chg24)} en 24 h</span>
        <span class="tipo" style="color:${colorTipo}">${etiqueta}<br><span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">${sub}</span></span>
      </div>
      <div class="medidores">
        ${medidor('Gatillo', r.trigger, r.trigger >= 60 ? 'var(--yellow)' : 'var(--muted)')}
        ${medidor('Aguante', r.persist, r.persist >= 58 ? 'var(--green)' : r.persist >= 45 ? 'var(--yellow)' : 'var(--muted)')}
      </div>
      ${lineaBallenas(r, lado)}
      ${lineaTendencia(r, lado)}
      <div class="niveles">
        <div class="niv"><div class="k">Precio ahora</div><div class="v">${num(p)}</div></div>
        <div class="niv"><div class="k">Stop</div><div class="v" style="color:var(--red)">${num(stop)}</div></div>
        <div class="niv"><div class="k">Objetivo</div><div class="v" style="color:var(--green)">${num(obj)}</div></div>
      </div>
      <div class="hist">${hist}</div>
      ${r.kindWhy ? `<div class="hist">${r.kindWhy}</div>` : ''}
    </div>`;
  }).join('');
}

/* ================= CICLO ================= */
async function actualizar() {
  if (app.escaneando) return;
  app.escaneando = true;
  document.getElementById('recargar').textContent = 'Buscando…';
  app.datos['-1'] = null; app.datos['1'] = null;
  app.foto = 'cargando';
  pintarLista(); pintarFoto();

  fotoMercado().then(f => { app.foto = f; pintarFoto(); })
               .catch(e => { app.foto = { error: e.message || String(e) }; pintarFoto(); });

  for (const lado of [-1, 1]) {
    try {
      app.datos[String(lado)] = await escanear(lado);
    } catch (e) {
      const vacio = []; vacio.fallo = true;
      app.datos[String(lado)] = vacio;
    }
    if (app.lado === lado) pintarLista();
  }
  app.hora = new Date();
  document.getElementById('pie').innerHTML =
    `Actualizado a las ${app.hora.toLocaleTimeString('es-MX')}. Se actualiza solo cada 15 minutos mientras la app esté abierta.<br><br>
     El <b>gatillo</b> mide si el movimiento está empezando ahora. El <b>aguante</b> mide si tiene combustible para durar horas. Un gatillo alto con aguante bajo es una sacudida: baja de golpe y rebota.<br><br>
     El stop y el objetivo salen del ATR (lo que se mueve una vela normal): stop a 1,5 y objetivo a 3.<br><br>
     Esto es un buscador, no un pronóstico. Enseña qué monedas cumplen ciertas condiciones y dónde está puesto el dinero grande. Que aparezca aquí no significa que vaya a caer.`;
  document.getElementById('recargar').textContent = 'Actualizar';
  app.escaneando = false;
}

document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    app.lado = parseInt(b.dataset.lado);
    document.querySelector('h1').textContent = app.lado < 0 ? '📡 Radar de caídas' : '📡 Radar de subidas';
    pintarLista();
  };
});
document.getElementById('recargar').onclick = actualizar;

(async function inicio() {
  try {
    const info = await pedir('/fapi/v1/exchangeInfo');
    app.simbolos = info.symbols
      .filter(s => s.contractType === 'PERPETUAL' && s.status === 'TRADING' && s.quoteAsset === 'USDT')
      .map(s => s.symbol);
    await actualizar();
    setInterval(actualizar, 15 * 60 * 1000);
  } catch (e) {
    const geo = e.status === 451 || e.status === 403;
    document.getElementById('lista').innerHTML = `<div class="aviso">${geo
      ? `<b>Binance rechazó la conexión (error ${e.status}).</b> Binance Futures no acepta conexiones desde algunos países ni desde ciertas VPN. Abre la app desde una red normal de tu país.`
      : `<b>No se pudo conectar con Binance:</b> ${e.message || e}. Revisa tu conexión y recarga.`}</div>`;
  }
})();
